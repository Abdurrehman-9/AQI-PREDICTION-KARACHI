name: ⚡ Feature Pipeline (Hourly)

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  run-feature-pipeline:
    name: Fetch & Store Features
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests python-dotenv \
            "hopsworks[python]==5.0.*" \
            pyarrow>=17.0 \
            confluent-kafka==2.3.0

      - name: Run feature pipeline
        working-directory: feature_pipeline
        env:
          AQICN_TOKEN:        ${{ secrets.AQICN_TOKEN }}
          OWM_API_KEY:        ${{ secrets.OWM_API_KEY }}
          HOPSWORKS_API_KEY:  ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT:  ${{ secrets.HOPSWORKS_PROJECT }}
          HOPSWORKS_HOST:     ${{ secrets.HOPSWORKS_HOST }}
          KARACHI_STATION_ID: "geo:24.8607;67.0011"
          KARACHI_LAT:        "24.8607"
          KARACHI_LON:        "67.0011"
        run: python run_pipeline.py
