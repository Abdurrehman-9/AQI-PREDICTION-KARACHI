name: Feature Pipeline (Hourly)

on:
  workflow_dispatch: # Allows manual triggers via the green button
  schedule:
    - cron: '0 * * * *' # Matches your DAG exactly: Runs hourly on the hour

jobs:
  run_hourly_pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests "hopsworks==4.7.*" pyarrow python-dotenv

      # ─── TASK 1: TRANSLATED FROM AIRFLOW 'health_check' ─────────────────
      - name: Health Check
        env:
          AQICN_TOKEN: ${{ secrets.AQICN_TOKEN }}
        run: |
          echo "Starting AQI Feature Pipeline at $(date -u)"
          python -c "
          import requests
          r = requests.get('https://api.waqi.info/feed/A471613/?token=${{ secrets.AQICN_TOKEN }}')
          print('AQICN reachable:', r.status_code == 200)
          "

      # ─── TASK 2: TRANSLATED FROM AIRFLOW 'run_feature_pipeline' ─────────
      - name: Run Feature Pipeline
        env:
          AQICN_TOKEN: ${{ secrets.AQICN_TOKEN }}
          OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
          HOPSWORKS_HOST: ${{ secrets.HOPSWORKS_HOST }}
          KARACHI_STATION_ID: "A471613"
          KARACHI_LAT: "24.8607"
          KARACHI_LON: "67.0011"
        run: |
          cd feature_pipeline
          python run_pipeline.py

      # ─── TASK 3: TRANSLATED FROM AIRFLOW 'log_completion' ────────────────
      - name: Log Completion
        run: echo "✅ Feature pipeline completed at $(date -u)"
